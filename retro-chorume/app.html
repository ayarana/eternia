<script>
  var MAX_SCORE = 10;

  var BAD_SCORE = 2;

  function norm(s) {
    return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  }

  function mean(list) {
    if (!list.length) return null;
    var sum = 0;
    for (var i = 0; i < list.length; i++) sum += list[i];
    return sum / list.length;
  }

  function summarize(games) {
    var scores = games.filter(function (g) { return g.score !== null; }).map(function (g) { return g.score; });
    return { total: games.length, played: scores.length, queue: games.length - scores.length, avg: mean(scores) };
  }

  function groupStats(games, field) {
    var groups = {};
    var order = [];
    games.forEach(function (g) {
      var raw = g[field];
      if (!raw) return;
      var key = field === 'viewer' ? norm(raw) : raw;
      if (!groups[key]) { groups[key] = { spellings: {}, games: [] }; order.push(key); }
      groups[key].spellings[raw] = (groups[key].spellings[raw] || 0) + 1;
      groups[key].games.push(g);
    });
    return order.map(function (key) {
      var grp = groups[key];
      var name = Object.keys(grp.spellings).sort(function (a, b) {
        return grp.spellings[b] - grp.spellings[a];
      })[0];
      var s = summarize(grp.games);
      return { key: key, name: name, total: s.total, played: s.played, avg: s.avg };
    });
  }

  function histogram(games, maxScore) {
    var bins = new Array(maxScore * 2).fill(0);
    games.forEach(function (g) {
      if (g.score === null) return;
      var i = Math.round(g.score * 2) - 1;
      bins[Math.min(Math.max(i, 0), bins.length - 1)]++;
    });
    return bins;
  }

  function rankOf(game, scored, order) {
    var better = 0;
    for (var i = 0; i < scored.length; i++) {
      if (order === 'asc' ? scored[i].score < game.score : scored[i].score > game.score) better++;
    }
    return better + 1;
  }

  function sortGames(list, order) {
    return list.slice().sort(function (a, b) {
      var d = order === 'asc' ? a.score - b.score : b.score - a.score;
      return d || a.title.localeCompare(b.title, 'pt-BR');
    });
  }
  function sideStats(games, badLimit) {
    var scored = games.filter(function (g) { return g.score !== null; });
    var byName = function (a, b) { return a.name.localeCompare(b.name, 'pt-BR'); };
    var consoles = groupStats(games, 'console');
    var bands = [0, 0, 0, 0];
    scored.forEach(function (g) {
      bands[g.score <= badLimit ? 0 : g.score <= 4 ? 1 : g.score <= 6 ? 2 : 3]++;
    });
    return {
      consolesByTotal: consoles.slice().sort(function (a, b) { return b.total - a.total || byName(a, b); }),
      consolesWorst: consoles.filter(function (c) { return c.played >= 5; })
        .sort(function (a, b) { return a.avg - b.avg || byName(a, b); }),
      badViewers: groupStats(scored.filter(function (g) { return g.score <= badLimit; }), 'viewer')
        .sort(function (a, b) { return b.total - a.total || byName(a, b); }),
      viewersByTotal: groupStats(games, 'viewer')
        .sort(function (a, b) { return b.total - a.total || byName(a, b); }),
      bands: bands,
      worst: sortGames(scored, 'asc').slice(0, 5),
      best: sortGames(scored, 'desc')[0] || null,
      zerados: games.filter(function (g) { return g.done; }).length
    };
  }

  function buildReel(pool, rows, rnd) {
    var pick = function () { return pool[Math.floor(rnd() * pool.length)]; };
    var items = [];
    var prev = null;
    var next = function () {
      var g = pick();
      for (var t = 0; pool.length > 1 && g === prev && t < 30; t++) g = pick();
      prev = g;
      return g;
    };
    var winner = pick();
    for (var i = 0; i < rows; i++) {
      var g = next();
      if (i === rows - 1 && pool.length > 1 && g === winner) g = pool[(pool.indexOf(g) + 1) % pool.length];
      items.push(g);
      prev = g;
    }
    items.push(winner);
    prev = winner;
    items.push(next());
    items.push(next());
    return { items: items, index: rows, winner: winner };
  }

  function fmt(n, digits) {
    return n === null || n === undefined ? '—' : n.toLocaleString('pt-BR', { minimumFractionDigits: digits, maximumFractionDigits: digits });
  }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var state = {
    data: null,
    tab: 'ranking',
    q: '',
    vq: '',
    platform: '',
    order: 'asc',
    status: '',
    sort: { consoles: { key: 'total', dir: -1 }, viewers: { key: 'played', dir: -1 } }
  };

  var $view = document.getElementById('view');
  var $summary = document.getElementById('summary');
  var $drips = document.getElementById('drips');
  var $tabs = document.getElementById('tabs');
  var $foot = document.getElementById('foot');

  function unplayed(g) { return g.score === null && !g.done; }

  function isListTab() {
    return state.tab === 'ranking' || state.tab === 'zerados' || state.tab === 'fila' || state.tab === 'todos';
  }

  function normalizeData(data) {
    var games = (data && data.games) || [];
    games.forEach(function (g) {
      if (typeof g.score !== 'number' || !isFinite(g.score)) g.score = null;
      if (g.viewer === undefined || g.viewer === '') g.viewer = null;
      g.done = !!g.done;
    });
    return { games: games, updatedAt: data && data.updatedAt };
  }

  function fetchData(ok, fail) {
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(ok).withFailureHandler(fail).getData();
      return;
    }
    if (!window.RETRO_API_URL) { fail(new Error('Falta o endereço dos dados (RETRO_API_URL).')); return; }
    fetch(window.RETRO_API_URL + '?format=json', { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('O servidor respondeu ' + res.status + '.');
        return res.json();
      })
      .then(function (data) {
        if (data && data.error) throw new Error(data.error);
        ok(data);
      })
      .catch(function (err) {
        fail(err instanceof SyntaxError
          ? new Error('Resposta inesperada do Apps Script. Confira se a implantação está aberta para "Qualquer pessoa".')
          : err);
      });
  }

  function load() {
    $foot.textContent = '';
    fetchData(
      function (data) { state.data = normalizeData(data); renderAll(); },
      function (err) { showError(err && err.message ? err.message : String(err)); }
    );
  }

  function showError(message) {
    $summary.textContent = 'Não foi possível carregar a lista.';
    $view.innerHTML = '<div class="notice"><p>' + esc(message) + '</p>' +
      '<button type="button" id="retry">Tentar de novo</button></div>';
    document.getElementById('retry').addEventListener('click', function () {
      $summary.textContent = 'Carregando a lista…';
      load();
    });
  }

  function renderHeader() {
    var s = summarize(state.data.games);
    $summary.innerHTML =
      '<strong>' + s.played + '</strong> de ' + s.total + ' jogos já passaram pelo chorume';

    var bins = histogram(state.data.games, MAX_SCORE);
    var top = Math.max.apply(null, bins) || 1;
    var cols = bins.map(function (n, i) {
      var label = fmt((i + 1) / 2, 1) + ': ' + plural(n, 'jogo', 'jogos');
      return '<div class="drip" title="' + label + '"><i style="--len:' + (n / top).toFixed(3) + ';--i:' + i + '"></i></div>';
    }).join('');

    var summaryText = bins.map(function (n, i) { return n ? fmt((i + 1) / 2, 1) + ' (' + n + ')' : ''; })
      .filter(Boolean).join(', ');

    var axis = bins.map(function (n, i) {
      var score = (i + 1) / 2;
      var labeled = i === 0 || (i + 1) % 5 === 0;
      return labeled
        ? '<span class="tick">' + String(score).replace('.', ',') + '</span>'
        : '<span></span>';
    }).join('');

    $drips.hidden = false;
    $drips.style.setProperty('--n', bins.length);
    $drips.innerHTML =
      '<div role="img" aria-label="Quantidade de jogos por nota: ' + summaryText + '">' +
      '<div class="drips__cols">' + cols + '</div>' +
      '<div class="drips__axis" aria-hidden="true">' + axis + '</div>' +
      '</div>';
  }

  function sideWin(key, tone, title, body) {
    return '<section class="sw sw--' + key + ' tone-' + tone + '"><div class="sw__bar"><span>' + title +
      '</span><i></i></div><div class="sw__body">' + body + '</div></section>';
  }

  function miniBars(rows, valueOf, label) {
    var max = Math.max.apply(null, rows.map(valueOf).concat([0.0001]));
    return rows.map(function (r) {
      return '<div class="mb"><span class="mb__n">' + esc(r.name) + '</span><b class="mb__v">' + label(r) +
        '</b><i style="--w:' + (valueOf(r) / max * 100).toFixed(1) + '%"></i></div>';
    }).join('');
  }

  function miniHist(bins) {
    var top = Math.max.apply(null, bins.concat([1]));
    return '<div class="mh">' + bins.map(function (n) {
      return '<i style="--h:' + (n / top * 100).toFixed(1) + '%"></i>';
    }).join('') + '</div>';
  }

  function terminal(lines) {
    return '<pre class="term">' + lines.map(esc).join('\n') + '<span class="term__cur">_</span></pre>';
  }

  function renderSides() {
    var $sides = document.getElementById('sides');
    var games = state.data.games;
    var s = summarize(games);
    var x = sideStats(games, BAD_SCORE);
    var bins = histogram(games, MAX_SCORE);
    var pctPlayed = s.total ? Math.round(s.played / s.total * 100) : 0;
    var bandNames = ['até ' + fmt(BAD_SCORE, 1), fmt(BAD_SCORE + 0.5, 1) + ' a 4', '4,5 a 6', 'acima de 6'];
    var bandRows = x.bands.map(function (n, i) { return { name: bandNames[i], n: n }; });
    var count = function (r) { return r.total; };
    var avg = function (r) { return fmt(r.avg, 1); };

    var made = [];
    function W(key, tone, title, body) {
      made.push({ tone: tone, title: title, body: body });
      return sideWin(key, tone, title, body);
    }

    var html = [
      W('a', 'l', 'consoles.dat', '<p class="sw__h">Consoles com mais jogos</p>' +
        miniBars(x.consolesByTotal.slice(0, 6), function (r) { return r.total; }, count)),

      W('b', 'y', 'chorume.rpt', '<p class="sw__h sw__h--c">RELATÓRIO DO CHORUME</p><dl class="rpt">' +
        '<dt>Avaliados</dt><dd>' + s.played + '</dd>' +
        '<dt>Na fila</dt><dd>' + s.queue + '</dd>' +
        '<dt>Média</dt><dd>' + fmt(s.avg, 2) + '</dd>' +
        '<dt>Melhor nota</dt><dd>' + (x.best ? fmt(x.best.score, 1) : '–') + '</dd>' +
        '<dt>Pior nota</dt><dd>' + (x.worst[0] ? fmt(x.worst[0].score, 1) : '–') + '</dd>' +
        '<dt>Zerados</dt><dd>' + x.zerados + '</dd></dl>' +
        (x.worst[0] ? '<p class="sw__act">&gt; Pior jogo: ' + esc(x.worst[0].title) + '</p>' : '')),

      W('c', 'p', 'cmd.exe', terminal(['> abrindo planilha', '> ' + s.total + ' jogos', '> media ' + fmt(s.avg, 2),
        '> fila: ' + s.queue, '> pronto'])),

      W('d', 'l', 'fila.pie', '<p class="sw__h">Já avaliados</p><div class="pie" style="--p:' + pctPlayed +
        '%"><b>' + pctPlayed + '%</b></div><p class="sw__cap">' + s.played + ' de ' + s.total + ' jogos</p>'),

      W('e', 'y', 'faixas.bnd', '<p class="sw__h">Jogos por faixa de nota</p>' +
        miniBars(bandRows, function (r) { return r.n; }, function (r) { return r.n; })),

      W('f', 'p', 'notas.img', '<p class="sw__h">Notas</p>' + miniHist(bins)),

      W('g', 'p', 'ruins.log', '<p class="sw__h">Quem mais indicou jogo ruim</p>' +
        miniBars(x.badViewers.slice(0, 5), count, count) +
        '<p class="sw__cap">jogos com nota até ' + fmt(BAD_SCORE, 1) + '</p>'),

      W('h', 'l', 'media.cfg', '<p class="sw__h">Menor média por console</p>' +
        miniBars(x.consolesWorst.slice(0, 5), function (r) { return r.avg; }, avg)),

      W('i', 'y', 'viewers.top', '<p class="sw__h">Quem mais indicou</p>' +
        miniBars(x.viewersByTotal.slice(0, 5), count, count)),

      W('j', 'l', 'piores.lst', '<p class="sw__h">Piores notas</p><ol class="wl">' +
        x.worst.slice(0, 4).map(function (g) {
          return '<li><span>' + esc(g.title) + '</span><b>' + fmt(g.score, 1) + '</b></li>';
        }).join('') + '</ol>'),

      W('k', 'p', 'gotas.exe', '<p class="sw__h">Notas</p>' + miniHist(bins)),

      W('l', 'y', 'ticker.log', terminal(['> ' + plural(s.played, 'jogo', 'jogos'), '> ' + plural(x.zerados, 'zerado', 'zerados'),
        '> ' + pctPlayed + '% avaliado'])),

      W('m', 'l', 'faixas.far', '<p class="sw__h">Jogos por faixa</p>' +
        miniBars(bandRows, function (r) { return r.n; }, function (r) { return r.n; })),

      W('n', 'p', 'consoles.far', '<p class="sw__h">Jogos por console</p>' +
        miniBars(x.consolesByTotal.slice(0, 4), function (r) { return r.total; }, count))
    ];

    var seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    var n = 0;
    ['L', 'R'].forEach(function (side, si) {
      var y = (si ? 104 : 96) + rnd() * 10;
      while (y < 800) {
        var it = made[n++ % 12];
        var w = 7.2 + rnd() * 2.4;
        var g = 0.1 + rnd() * 1.2;
        html.push(sideWin('x', it.tone, it.title, it.body)
          .replace('class="sw sw--x', 'class="sw sw--x sw--' + side)
          .replace('<section ', '<section style="--y:' + y.toFixed(1) + 'rem;--w:' + w.toFixed(1) + 'rem;--g:' + g.toFixed(1) + 'rem" '));
        y += 22 + rnd() * 16;
      }
    });
    $sides.innerHTML = html.join('');
  }

  function renderFooter() {
    $foot.innerHTML = '<button type="button" class="link" id="reload">Atualizar</button>';
    document.getElementById('reload').addEventListener('click', load);
  }

  var WINDOW_TITLES = {
    ranking: 'ranking.lst', consoles: 'consoles.dat', viewers: 'viewers.dat',
    zerados: 'zerados.lst', fila: 'fila.txt', todos: 'tudo.lst', sorteio: 'sorteio.exe', admin: 'admin.exe'
  };

  function renderTabs() {
    Array.prototype.forEach.call($tabs.querySelectorAll('button'), function (b) {
      if (b.dataset.tab === state.tab) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    var adminBtn = $tabs.querySelector('[data-tab="admin"]');
    if (adminBtn) adminBtn.hidden = !auth.admin;
    document.getElementById('wintitle').textContent = WINDOW_TITLES[state.tab];
  }

  function setTab(tab) {
    if (tab === 'admin' && !auth.admin) tab = 'ranking';
    if (tab !== 'admin') adminState.msg = null;
    state.tab = tab;
    if (history.replaceState) { try { history.replaceState(null, '', '#' + tab); } catch (e) {} }
    renderTabs();
    renderView();
  }

  function renderAll() {
    renderHeader();
    renderSides();
    renderFooter();
    renderTabs();
    renderView();
  }

  function renderView() {
    if (!state.data) return;
    if (state.tab === 'admin') renderAdminView();
    else if (isListTab()) renderListView();
    else if (state.tab === 'consoles') renderTable('consoles');
    else if (state.tab === 'viewers') renderTable('viewers');
    else renderRoulette();
  }

  function consoleOptions() {
    var names = groupStats(state.data.games, 'console').map(function (c) { return c.name; })
      .sort(function (a, b) { return a.localeCompare(b, 'pt-BR'); });
    return '<option value="">Todos</option>' + names.map(function (n) {
      return '<option value="' + esc(n) + '"' + (n === state.platform ? ' selected' : '') + '>' + esc(n) + '</option>';
    }).join('');
  }

  function renderListView() {
    var isRanking = state.tab === 'ranking';
    $view.innerHTML =
      '<div class="filters">' +
        '<label class="field field--grow">Buscar jogo ou viewer' +
          '<input type="search" id="q" value="' + esc(state.q) + '" autocomplete="off"></label>' +
        '<label class="field">Console<select id="platform">' + consoleOptions() + '</select></label>' +
        (state.tab === 'todos'
          ? '<label class="field">Situação<select id="status">' +
              '<option value=""' + (state.status === '' ? ' selected' : '') + '>Todos</option>' +
              '<option value="played"' + (state.status === 'played' ? ' selected' : '') + '>Já jogados</option>' +
              '<option value="pending"' + (state.status === 'pending' ? ' selected' : '') + '>Ainda não jogados</option>' +
            '</select></label>'
          : '') +
        (isRanking
          ? '<label class="field">Ordem<select id="order">' +
              '<option value="asc"' + (state.order === 'asc' ? ' selected' : '') + '>Pior nota primeiro</option>' +
              '<option value="desc"' + (state.order === 'desc' ? ' selected' : '') + '>Melhor nota primeiro</option>' +
            '</select></label>'
          : '') +
      '</div><div id="results"></div>';

    document.getElementById('q').addEventListener('input', function (e) { state.q = e.target.value; renderResults(); });
    document.getElementById('platform').addEventListener('change', function (e) { state.platform = e.target.value; renderResults(); });
    if (state.tab === 'todos') document.getElementById('status').addEventListener('change', function (e) { state.status = e.target.value; renderResults(); });
    if (isRanking) document.getElementById('order').addEventListener('change', function (e) { state.order = e.target.value; renderResults(); });

    renderResults();
  }

  function matches(g) {
    if (state.platform && g.console !== state.platform) return false;
    var q = norm(state.q);
    return !q || norm(g.title).indexOf(q) !== -1 || norm(g.viewer).indexOf(q) !== -1;
  }

  function gameInfo(g, hideBadge) {
    return '<div class="title">' + esc(g.title) + (g.done && !hideBadge ? '<span class="badge">zerado</span>' : '') + '</div>' +
      '<div class="meta"><span class="chip">' + esc(g.console) + '</span>' +
      (g.viewer ? '<button type="button" class="link" data-viewer="' + esc(g.viewer) + '">' + esc(g.viewer) + '</button>' : '<span>sem viewer</span>') +
      '</div>';
  }

  function renderResults() {
    var $r = document.getElementById('results');
    var games = state.data.games;
    var html;

    if (state.tab === 'ranking') {
      var scored = games.filter(function (g) { return g.score !== null; });
      var list = sortGames(scored.filter(matches), state.order);
      html = '<p class="count" aria-live="polite">' + plural(list.length, 'jogo', 'jogos') + '</p>';
      if (!list.length) {
        html += '<div class="notice">Nenhum jogo encontrado. Limpe a busca ou escolha outro console.</div>';
      } else {
        html += '<ol class="list">' + list.map(function (g) {
          return '<li class="row"><span class="pos">' + rankOf(g, scored, state.order) + '</span><div>' + gameInfo(g) + '</div>' +
            '<div class="score"><span class="score__num">' + fmt(g.score, 1) + '</span>' +
            '<span class="score__bar" aria-hidden="true"><i style="width:' + Math.min(g.score / MAX_SCORE * 100, 100) + '%"></i></span></div></li>';
        }).join('') + '</ol>';
      }
    } else if (state.tab === 'zerados') {
      var done = games.filter(function (g) { return g.done && matches(g); })
        .sort(function (a, b) { return a.title.localeCompare(b.title, 'pt-BR'); });
      html = '<p class="count" aria-live="polite">' + plural(done.length, 'jogo zerado', 'jogos zerados') + '</p>';
      if (!done.length) {
        html += '<div class="notice">Nenhum jogo zerado com esses filtros.</div>';
      } else {
        html += '<ul class="list">' + done.map(function (g) {
          return '<li class="row row--plain"><div>' + gameInfo(g, true) + '</div>' +
            '<div class="score">' + (g.score === null
              ? '<span class="score__num score--none">sem nota</span>'
              : '<span class="score__num">' + fmt(g.score, 1) + '</span>') + '</div></li>';
        }).join('') + '</ul>';
      }
    } else if (state.tab === 'todos') {
      var all = games.filter(function (g) {
        if (!matches(g)) return false;
        if (state.status === 'pending') return unplayed(g);
        if (state.status === 'played') return !unplayed(g);
        return true;
      }).sort(function (a, b) { return a.title.localeCompare(b.title, 'pt-BR'); });
      var pendingN = all.filter(unplayed).length;
      html = '<p class="count" aria-live="polite">' + plural(all.length, 'jogo', 'jogos') +
        ' (' + (all.length - pendingN) + ' já jogados, ' + pendingN + ' ainda não jogados)</p>';
      if (!all.length) {
        html += '<div class="notice">Nenhum jogo encontrado. Limpe a busca ou escolha outro filtro.</div>';
      } else {
        html += '<ul class="list">' + all.map(function (g) {
          var right = g.score !== null
            ? '<span class="score__num">' + fmt(g.score, 1) + '</span>'
            : (g.done ? '<span class="score__num score--none">sem nota</span>'
                      : '<span class="score__num score--pending">não jogado</span>');
          return '<li class="row row--plain' + (unplayed(g) ? ' row--pending' : '') + '"><div>' + gameInfo(g) + '</div>' +
            '<div class="score">' + right + '</div></li>';
        }).join('') + '</ul>';
      }
    } else {
      var queue = games.filter(function (g) { return unplayed(g) && matches(g); });
      html = '<p class="count" aria-live="polite">' + plural(queue.length, 'jogo', 'jogos') + ' na fila</p>';
      if (!queue.length) {
        html += '<div class="notice">Nenhum jogo na fila com esses filtros.</div>';
      } else {
        var byConsole = {};
        queue.forEach(function (g) { (byConsole[g.console] = byConsole[g.console] || []).push(g); });
        html += Object.keys(byConsole).sort(function (a, b) { return a.localeCompare(b, 'pt-BR'); }).map(function (c) {
          return '<section class="group"><h2>' + esc(c) + '</h2><ul class="list">' +
            byConsole[c].sort(function (a, b) { return a.title.localeCompare(b.title, 'pt-BR'); }).map(function (g) {
              return '<li class="row row--plain"><div><div class="title">' + esc(g.title) + '</div>' +
                '<div class="meta">' + (g.viewer ? '<button type="button" class="link" data-viewer="' + esc(g.viewer) + '">' + esc(g.viewer) + '</button>' : '<span>sem viewer</span>') +
                '</div></div></li>';

  var TABLE_COLUMNS = {
    consoles: [['name', 'Console'], ['avg', 'Média'], ['played', 'Jogados'], ['total', 'Total']],
    viewers:  [['name', 'Viewer'],  ['avg', 'Média'], ['played', 'Jogados'], ['total', 'Enviados']]
  };

  function renderTable(which) {
    $view.innerHTML =
      (which === 'viewers'
        ? '<div class="filters"><label class="field field--grow">Buscar viewer' +
            '<input type="search" id="vq" value="' + esc(state.vq) + '" autocomplete="off"></label></div>'
        : '') +
      '<div id="tres"></div>';
    fillTable(which);
  }

  function fillTable(which) {
    var field = which === 'consoles' ? 'console' : 'viewer';
    var rows = groupStats(state.data.games, field);
    var cfg = state.sort[which];
    if (which === 'viewers' && norm(state.vq)) {
      var vq = norm(state.vq);
      rows = rows.filter(function (r) { return norm(r.name).indexOf(vq) !== -1; });
    }

    rows.sort(function (a, b) {
      var av = a[cfg.key], bv = b[cfg.key];
      if (av === null && bv === null) return a.name.localeCompare(b.name, 'pt-BR');
      if (av === null) return 1;
      if (bv === null) return -1;
      var d = cfg.key === 'name' ? av.localeCompare(bv, 'pt-BR') : av - bv;
      return d ? d * cfg.dir : a.name.localeCompare(b.name, 'pt-BR');
    });

    var head = TABLE_COLUMNS[which].map(function (c) {
      var sorted = cfg.key === c[0];
      return '<th scope="col" aria-sort="' + (sorted ? (cfg.dir === 1 ? 'ascending' : 'descending') : 'none') + '">' +
        '<button type="button" data-sort="' + c[0] + '">' + c[1] + '</button></th>';
    }).join('');

    var body = rows.map(function (r) {
      var nameCell = which === 'viewers'
        ? '<button type="button" class="link" data-viewer="' + esc(r.name) + '">' + esc(r.name) + '</button>'
        : '<button type="button" class="link" data-console="' + esc(r.name) + '">' + esc(r.name) + '</button>';
      return '<tr><td>' + nameCell + '</td><td>' + fmt(r.avg, 2) + '</td><td>' + r.played + '</td><td>' + r.total + '</td></tr>';
    }).join('');

    document.getElementById('tres').innerHTML =
      '<p class="count">' + plural(rows.length, which === 'consoles' ? 'console' : 'viewer', which === 'consoles' ? 'consoles' : 'viewers') + '</p>' +
      (rows.length
        ? '<div class="table-wrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>'
        : '<p class="count">Nenhum viewer encontrado.</p>');
  }

  var SPIN_MS = 5200;
  var SPIN_ROWS = 42;
  var roulette = { busy: false, platform: '', fresh: false };

  function playedViewers() {
    var set = {};
    state.data.games.forEach(function (g) {
      if (g.viewer && !unplayed(g)) set[norm(g.viewer)] = true;
    });
    return set;
  }

  function queueGames() {
    var seen = roulette.fresh ? playedViewers() : null;
    return state.data.games.filter(function (g) {
      if (!unplayed(g)) return false;
      if (roulette.platform && g.console !== roulette.platform) return false;
      if (seen && (!g.viewer || seen[norm(g.viewer)])) return false;
      return true;
    });
  }

  function reelRow(g) {
    return '<div class="reel__row"><span class="reel__title">' + esc(g.title) + '</span>' +
      '<span class="reel__meta">' + esc(g.console) + '</span></div>';
  }

  function renderRoulette() {
    roulette.busy = false;
    var queueAll = state.data.games.filter(unplayed);
    var names = {};
    queueAll.forEach(function (g) { if (g.console) names[g.console] = true; });
    var options = '<option value="">Todos</option>' + Object.keys(names)
      .sort(function (a, b) { return a.localeCompare(b, 'pt-BR'); })
      .map(function (n) {
        return '<option value="' + esc(n) + '"' + (n === roulette.platform ? ' selected' : '') + '>' + esc(n) + '</option>';
      }).join('');

    $view.innerHTML =
      '<section class="roulette">' +
        '<div class="roulette__top">' +
          '<label class="field"><span>Console</span><select id="rplatform">' + options + '</select></label>' +
          '<label class="check"><input type="checkbox" id="rfresh"' + (roulette.fresh ? ' checked' : '') + '> Só viewers sem jogos jogados</label>' +
          '<p class="count" id="rcount"></p>' +
        '</div>' +
        '<div class="reel" id="reel" aria-hidden="true">' +
          '<div class="reel__strip" id="strip">' +
            '<div class="reel__row"><span class="reel__title">?</span></div>' +
            '<div class="reel__row"><span class="reel__title">? ? ?</span></div>' +
            '<div class="reel__row"><span class="reel__title">?</span></div>' +
          '</div>' +
        '</div>' +
        '<button type="button" class="spin" id="spin">SORTEAR</button>' +
        '<div class="result" id="rresult" role="status" aria-live="polite"></div>' +
        '<div id="rleft"></div>' +
      '</section>';

    document.getElementById('spin').addEventListener('click', spinRoulette);
    document.getElementById('rplatform').addEventListener('change', function (e) {
      roulette.platform = e.target.value;
      updateRouletteCount();
      renderRemaining();
    });
    document.getElementById('rfresh').addEventListener('change', function (e) {
      roulette.fresh = e.target.checked;
      updateRouletteCount();
    });
    updateRouletteCount();
    renderRemaining();
  }

  function updateRouletteCount() {
    var n = queueGames().length;
    document.getElementById('rcount').textContent = plural(n, 'jogo', 'jogos') + ' na fila';
    document.getElementById('spin').disabled = !n;
    if (!n) document.getElementById('rresult').innerHTML = '<p class="result__none">Nenhum jogo na fila' +
      (roulette.platform ? ' para esse console' : '') + (roulette.fresh ? ' de viewers sem jogos jogados' : '') + '.</p>';
    else document.getElementById('rresult').innerHTML = '';
  }

  function renderRemaining() {
    var $l = document.getElementById('rleft');
    if (!$l) return;
    var by = {};
    state.data.games.filter(unplayed).forEach(function (g) {
      var c = g.console || 'sem console';
      by[c] = (by[c] || 0) + 1;
    });
    var rows = Object.keys(by).map(function (c) { return { name: c, n: by[c] }; })
      .sort(function (x, y) { return y.n - x.n || x.name.localeCompare(y.name, 'pt-BR'); });
    if (!rows.length) { $l.innerHTML = ''; return; }
    var top = rows[0].n;
    $l.innerHTML = '<section class="left"><h3 class="left__h">Jogos restantes por console</h3><ol class="left__list">' +
      rows.map(function (r) {
        return '<li' + (r.name === roulette.platform ? ' class="is-sel"' : '') + '><span class="left__name">' + esc(r.name) + '</span>' +
          '<span class="left__bar" aria-hidden="true"><i style="width:' + (r.n / top * 100).toFixed(1) + '%"></i></span>' +
          '<span class="left__n">' + r.n + '</span></li>';
      }).join('') + '</ol></section>';
  }

  function spinRoulette() {
    if (roulette.busy) return;
    var pool = queueGames();
    if (!pool.length) return;
    roulette.busy = true;

    var reel = buildReel(pool, SPIN_ROWS, Math.random);
    var $strip = document.getElementById('strip');
    var $reel = document.getElementById('reel');
    var $btn = document.getElementById('spin');
    var $result = document.getElementById('rresult');
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    $btn.disabled = true;
    $btn.textContent = 'SORTEANDO…';
    $result.innerHTML = '';
    $reel.classList.remove('reel--landed');
    $reel.classList.add('reel--spin');
    $strip.style.transition = 'none';
    $strip.style.transform = 'translateY(0)';
    $strip.innerHTML = reel.items.map(reelRow).join('');
    var rowH = $strip.firstElementChild.getBoundingClientRect().height;
    void $strip.offsetHeight;

    var finished = false;
    function land() {
      if (finished) return;
      finished = true;
      if (!document.body.contains($strip)) return;
      roulette.busy = false;
      $reel.classList.remove('reel--spin');
      $reel.classList.add('reel--landed');
      $strip.children[reel.index].classList.add('reel__row--win');
      var g = reel.winner;
      $result.innerHTML = '<p class="result__label">Caiu:</p>' +
        '<p class="result__title">' + esc(g.title) + '</p>' +
        '<p class="result__meta"><span class="chip">' + esc(g.console) + '</span>' +
        (g.viewer ? 'indicado por <strong>' + esc(g.viewer) + '</strong>' : '') + '</p>';
      $btn.textContent = 'SORTEAR DE NOVO';
      $btn.disabled = false;
      $btn.focus();
    }

    var offset = -(reel.index - 1) * rowH;
    if (reduce) {
      $strip.style.transform = 'translateY(' + offset + 'px)';
      land();
      return;
    }
    $strip.style.transition = 'transform ' + SPIN_MS + 'ms cubic-bezier(0.35, 0.3, 0.3, 1)';
    $strip.style.transform = 'translateY(' + offset + 'px)';
    $strip.addEventListener('transitionend', land, { once: true });
    setTimeout(land, SPIN_MS + 400);
  }

  var auth = { token: null, email: '', first: '', admin: false, exp: 0, gis: false };
  var authUi = { open: false, msg: null };
  var adminState = { q: '', msg: null, busy: false };
  var $auth = document.getElementById('authbar');

  function adminEnabled() {
    if (window.google && google.script && google.script.run) return false;
    return !!(window.RETRO_DEMO || (window.RETRO_API_URL && window.RETRO_GOOGLE_CLIENT_ID));
  }

  function decodeJwt(token) {
    try {
      var p = String(token).split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      while (p.length % 4) p += '=';
      var bin = atob(p);
      return JSON.parse(decodeURIComponent(bin.split('').map(function (c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join('')));
    } catch (e) { return {}; }
  }

  function firstName(who, email) {
    var n = String(who.given_name || who.name || '').trim().split(/\s+/)[0];
    if (!n) {
      n = String(email || '').split('@')[0].split(/[._+\-]/)[0];
      n = n.charAt(0).toUpperCase() + n.slice(1);
    }
    return n;
  }

  function authValid() { return !!auth.token && Date.now() / 1000 < auth.exp - 60; }

  function storeToken(token) {
    try {
      if (token) sessionStorage.setItem('retro_tok', token);
      else sessionStorage.removeItem('retro_tok');
    } catch (e) {}
  }

  function demoPost(action, body) {
    return new Promise(function (resolve, reject) {
      setTimeout(function () {
        var who = decodeJwt(body.idToken);
        if (who.email !== 'admin@demo') { reject(new Error('Acesso negado: esta conta não é admin do Retrô Chorume.')); return; }
        if (action === 'whoami') { resolve({ ok: true, email: who.email, admin: true }); return; }
        var g = body.game || {};
        var same = state.data.games.filter(function (x) { return norm(x.title) === norm(g.jogo) && norm(x.console) === norm(g.console); });
        if (action === 'add') {
          if (same.length) { reject(new Error('Esse jogo já está na lista (' + g.console + ').')); return; }
          state.data.games.push({ title: g.jogo, done: false, console: g.console, viewer: g.viewer || null, score: null });
          resolve({ ok: true });
          return;
        }
        var hit = same.filter(unplayed)[0];
        if (!hit) { reject(new Error('Não achei esse jogo na lista. Atualize a página.')); return; }
        hit.score = g.nota;
        if (g.zerado) hit.done = true;
        resolve({ ok: true });
      }, 250);
    });
  }

  function adminPost(action, body) {
    if (window.RETRO_DEMO) return demoPost(action, body);
    return fetch(window.RETRO_API_URL, {
      method: 'POST',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action }, body))
    }).then(function (res) { return res.json(); }).then(function (j) {
      if (!j || !j.ok) throw new Error((j && j.error) || 'Erro desconhecido.');
      return j;
    }, function (err) {
      throw err instanceof SyntaxError
        ? new Error('Resposta inesperada do servidor.')
        : new Error('Não consegui falar com o servidor. Tente de novo.');
    });
  }

  function setAuthMsg(text, isErr) {
    authUi.msg = text ? { text: text, err: !!isErr } : null;
    var el = document.getElementById('authMsg');
    if (!el) return;
    el.textContent = text || '';
    el.className = 'msg authbar__msg' + (isErr ? ' msg--err' : '');
  }

  function setAdminMsg(text, isErr) {
    adminState.msg = { text: text, err: !!isErr };
    var el = document.getElementById('adminMsg');
    if (!el) return;
    el.textContent = text;
    el.className = 'msg' + (isErr ? ' msg--err' : '');
  }

  function signOut() {
    auth.token = null; auth.email = ''; auth.first = ''; auth.admin = false; auth.exp = 0;
    storeToken(null);
    try { google.accounts.id.disableAutoSelect(); } catch (e) {}
    renderTabs();
    renderAuthbar();
    if (state.tab === 'admin') setTab('ranking');
  }

  function expired() {
    authUi.open = false;
    authUi.msg = { text: 'Seu login expirou (dura cerca de 1 hora). Entre de novo.', err: true };
    signOut();
  }

  function onCredential(token, quiet) {
    var who = decodeJwt(token);
    auth.token = token; auth.exp = who.exp || 0; auth.email = who.email || ''; auth.first = firstName(who, auth.email);
    if (!quiet) setAuthMsg('Verificando no servidor…', false);
    return adminPost('whoami', { idToken: token }).then(function (r) {
      auth.admin = true;
      auth.email = r.email || auth.email;
      if (!who.given_name && !who.name) auth.first = firstName(who, auth.email);
      authUi.open = false;
      authUi.msg = null;
      storeToken(token);
      renderTabs();
      renderAuthbar();
      if (!quiet) setTab('admin');
      else if (state.tab === 'admin') renderView();
    }, function (err) {
      authUi.msg = null;
      signOut();
      if (!quiet) setAuthMsg('✖ ' + err.message, true);
    });
  }

  function loadGis() {
    return new Promise(function (resolve, reject) {
      if (window.google && google.accounts && google.accounts.id) { resolve(); return; }
      var s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true;
      s.onload = resolve;
      s.onerror = function () { reject(new Error('Não deu para carregar o login do Google.')); };
      document.head.appendChild(s);
    });
  }

  function fakeToken(email) {
    return 'x.' + btoa(JSON.stringify({ email: email, exp: Math.floor(Date.now() / 1000) + 3600 })).replace(/=+$/, '') + '.x';
  }

  function mountSignIn() {
    var box = document.getElementById('gsiBtn');
    if (!box) return;
    if (window.RETRO_DEMO) {
      box.innerHTML =
        '<button type="button" class="btn btn--small" data-demo="admin@demo">Admin (demo)</button> ' +
        '<button type="button" class="btn btn--small" data-demo="visitante@demo">Visitante (demo)</button>';
      return;
    }
    loadGis().then(function () {
      if (!auth.gis) {
        google.accounts.id.initialize({
          client_id: window.RETRO_GOOGLE_CLIENT_ID,
          callback: function (r) { onCredential(r.credential, false); },
          ux_mode: 'popup',
          auto_select: false
        });
        auth.gis = true;
      }
      var el = document.getElementById('gsiBtn');
      if (el && authUi.open && !auth.admin) {
        google.accounts.id.renderButton(el, { theme: 'filled_black', size: 'medium', shape: 'rectangular', text: 'signin', locale: 'pt-BR' });
      }
    }).catch(function (err) { setAuthMsg('✖ ' + err.message, true); });
  }

  function renderAuthbar() {
    if (!adminEnabled()) { $auth.hidden = true; return; }
    $auth.hidden = false;
    var html;
    if (auth.admin) {
      html = '<span class="authbar__who" title="' + esc(auth.email) + '">' + esc(auth.first || auth.email) + '</span>' +
        '<button type="button" class="btn btn--small" data-auth="logout">Sair</button>';
    } else if (authUi.open) {
      html = '<div id="gsiBtn" class="gsi"></div>' +
        '<button type="button" class="link" data-auth="close">cancelar</button>';
    } else {
      html = '<button type="button" class="btn btn--small" data-auth="open">Login</button>';
    }
    $auth.innerHTML = html + '<div id="authMsg" class="msg authbar__msg" role="status"></div>';
    if (authUi.msg) setAuthMsg(authUi.msg.text, authUi.msg.err);
    if (!auth.admin && authUi.open) mountSignIn();
  }

  function byPt(a, b) { return a.localeCompare(b, 'pt-BR'); }

  function datalist(id, names) {
    return '<datalist id="' + id + '">' + names.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>';
  }

  function renderAdminView() {
    if (!auth.admin) { setTab('ranking'); return; }
    var games = state.data.games;
    var consoles = groupStats(games, 'console').map(function (c) { return c.name; }).sort(byPt);
    var viewers = groupStats(games, 'viewer').map(function (c) { return c.name; }).sort(byPt);
    $view.innerHTML =
      '<div class="admin">' +
        '<h2>Novo jogo na fila</h2>' +
        '<form id="addForm" class="filters" autocomplete="off">' +
          '<label class="field field--grow">Jogo<input name="jogo" maxlength="150" required></label>' +
          '<label class="field">Console<input name="console" maxlength="60" list="adminConsoles" required></label>' +
          '<label class="field">Viewer<input name="viewer" maxlength="60" list="adminViewers"></label>' +
          '<button type="submit" class="btn">Adicionar à fila</button>' +
        '</form>' +
        datalist('adminConsoles', consoles) + datalist('adminViewers', viewers) +
        '<div id="adminMsg" class="msg" role="status"></div>' +
        '<h2>Dar nota</h2>' +
        '<div class="filters"><label class="field field--grow">Buscar na fila' +
          '<input type="search" id="adminQ" value="' + esc(adminState.q) + '" autocomplete="off"></label></div>' +
        '<div id="adminList"></div>' +
      '</div>';
    if (adminState.msg) setAdminMsg(adminState.msg.text, adminState.msg.err);
    renderAdminList();
  }

  function renderAdminList() {
    var q = norm(adminState.q);
    var list = state.data.games.filter(unplayed).filter(function (g) {
      return !q || norm(g.title).indexOf(q) !== -1 || norm(g.viewer).indexOf(q) !== -1 || norm(g.console).indexOf(q) !== -1;
    }).sort(function (a, b) { return byPt(a.title, b.title); });

    var html = '<p class="count" aria-live="polite">' + plural(list.length, 'jogo', 'jogos') + ' na fila</p>';
    if (!list.length) {
      html += '<div class="notice">Nenhum jogo na fila' + (q ? ' com essa busca' : '') + '.</div>';
    } else {
      html += '<ul class="list">' + list.map(function (g) {
        return '<li class="row row--plain row--rate"><div><div class="title">' + esc(g.title) + '</div>' +
          '<div class="meta"><span class="chip">' + esc(g.console) + '</span>' +
          (g.viewer ? '<span>' + esc(g.viewer) + '</span>' : '<span>sem viewer</span>') + '</div></div>' +
          '<form class="rate" data-title="' + esc(g.title) + '" data-console="' + esc(g.console) + '">' +
            '<input type="number" name="nota" min="0.5" max="' + MAX_SCORE + '" step="0.5" inputmode="decimal" required aria-label="Nota de ' + esc(g.title) + '">' +
            '<label class="check"><input type="checkbox" name="zerado"> zerado</label>' +
            '<button type="submit" class="btn">Dar nota</button></form></li>';
      }).join('') + '</ul>';
    }
    document.getElementById('adminList').innerHTML = html;
  }

  function refreshAfterWrite() {
    if (window.RETRO_DEMO) renderAll();
    else load();
  }

  function runAdmin(action, game, doneText) {
    adminState.busy = true;
    setAdminMsg('Salvando…', false);
    Array.prototype.forEach.call($view.querySelectorAll('.admin button'), function (b) { b.disabled = true; });
    adminPost(action, { idToken: auth.token, game: game }).then(function () {
      adminState.busy = false;
      adminState.msg = { text: doneText, err: false };
      refreshAfterWrite();
    }, function (err) {
      adminState.busy = false;
      Array.prototype.forEach.call($view.querySelectorAll('.admin button'), function (b) { b.disabled = false; });
      setAdminMsg('✖ ' + err.message, true);
    });
  }

  function submitAdd(form) {
    if (adminState.busy) return;
    if (!authValid()) { expired(); return; }
    var game = {
      jogo: form.elements.jogo.value.trim(),
      console: form.elements['console'].value.trim(),
      viewer: form.elements.viewer.value.trim()
    };
    if (!game.jogo || !game.console) { setAdminMsg('✖ Preencha o jogo e o console.', true); return; }
    runAdmin('add', game, 'Adicionado à fila: ' + game.jogo + ' [' + game.console + ']');
  }

  function submitRate(form) {
    if (adminState.busy) return;
    if (!authValid()) { expired(); return; }
    var nota = parseFloat(String(form.elements.nota.value).replace(',', '.'));
    if (!isFinite(nota) || nota < 0.5 || nota > MAX_SCORE || Math.round(nota * 2) !== nota * 2) {
      setAdminMsg('✖ Nota inválida: use de 0,5 a ' + MAX_SCORE + ', de meio em meio ponto.', true);
      return;
    }
    var zerado = !!form.elements.zerado.checked;
    runAdmin('rate', { jogo: form.dataset.title, console: form.dataset.console, nota: nota, zerado: zerado },
      'Nota ' + fmt(nota, 1) + ' para ' + form.dataset.title + (zerado ? ' (zerado)' : '') + ': saiu da fila.');
  }

  function restoreAuth() {
    if (!adminEnabled()) return;
    try {
      var t = sessionStorage.getItem('retro_tok');
      if (t && decodeJwt(t).exp * 1000 > Date.now() + 60000) onCredential(t, true);
    } catch (e) {}
  }

  $auth.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-auth], button[data-demo]');
    if (!b) return;
    if (b.dataset.demo) { onCredential(fakeToken(b.dataset.demo), false); return; }
    if (b.dataset.auth === 'open') { authUi.open = true; authUi.msg = null; renderAuthbar(); }
    else if (b.dataset.auth === 'close') { authUi.open = false; authUi.msg = null; renderAuthbar(); }
    else if (b.dataset.auth === 'logout') { authUi.open = false; authUi.msg = null; signOut(); }
  });

  $view.addEventListener('submit', function (e) {
    var form = e.target;
    if (form.id === 'addForm') { e.preventDefault(); submitAdd(form); }
    else if (form.classList && form.classList.contains('rate')) { e.preventDefault(); submitRate(form); }
  });

  $view.addEventListener('input', function (e) {
    if (e.target.id === 'vq') { state.vq = e.target.value; fillTable('viewers'); }
    else if (e.target.id === 'adminQ') { adminState.q = e.target.value; renderAdminList(); }
  });

  $tabs.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]');
    if (b) setTab(b.dataset.tab);
  });

  $view.addEventListener('click', function (e) {
    var sortBtn = e.target.closest('button[data-sort]');
    if (sortBtn) {
      var cfg = state.sort[state.tab];
      var key = sortBtn.dataset.sort;
      cfg.dir = cfg.key === key ? -cfg.dir : (key === 'name' ? 1 : -1);
      cfg.key = key;
      renderTable(state.tab);
      return;
    }
    var viewerBtn = e.target.closest('button[data-viewer]');
    var consoleBtn = e.target.closest('button[data-console]');
    if (!viewerBtn && !consoleBtn) return;

    state.q = viewerBtn ? viewerBtn.dataset.viewer : '';
    state.platform = consoleBtn ? consoleBtn.dataset.console : '';
    if (viewerBtn) {
      state.status = '';
      if (state.tab === 'todos') renderListView(); else setTab('todos');
      return;
    }
    if (isListTab()) renderListView();
    else setTab('ranking');
  });

  var initial = (location.hash || '').replace('#', '');
  if (['ranking', 'consoles', 'viewers', 'zerados', 'fila', 'todos', 'sorteio'].indexOf(initial) !== -1) state.tab = initial;

  function placeAuthbar() {
    var nav = document.querySelector('.sitenav');
    var small = window.matchMedia && window.matchMedia('(max-width: 48rem)').matches;
    if (nav && small) {
      if ($auth.parentNode !== nav) nav.appendChild($auth);
      $auth.classList.add('authbar--nav');
    } else {
      $auth.classList.remove('authbar--nav');
      var page = document.querySelector('.page');
      if (page && $auth.parentNode !== page.parentNode) page.parentNode.insertBefore($auth, page);
    }
  }
  placeAuthbar();
  if (window.matchMedia) {
    var mq = window.matchMedia('(max-width: 48rem)');
    if (mq.addEventListener) mq.addEventListener('change', placeAuthbar);
    else if (mq.addListener) mq.addListener(placeAuthbar);
  }

  renderAuthbar();
  load();
  restoreAuth();
</script>
